
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIZZA | My Website</title>
    <style>
        body {
            background-color: #0d001a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            padding: 40px 20px;
        }
        .blog-section, .contact-section, .social-section {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid #8a2be2;
        }
        .blog-post {
            background: #1a0033;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            text-align: left;
        }
        .blog-post h4 {
            color: #d1b3ff;
            margin-top: 0;
        }
        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #8a2be2;
            background: #1a0033;
            color: white;
        }
        button, .social-btn {
            background: #a200ff;
            color: white;
            padding: 12px 25px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
        button:hover, .social-btn:hover {
            background: #8a2be2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FIZZA ✨</h1>
        <p>Welcome To My World 💜</p>

        <div class="social-section">
            <h3>Connect With Me</h3>
            <div>
                <a href="https://www.instagram.com" target="_blank" class="social-btn">Instagram</a>
                <a href="https://github.com/Fizzawabsite" target="_blank" class="social-btn">GitHub</a>
            </div>
        </div>

        <div class="blog-section">
            <h3>My Blog</h3>
            <div class="blog-post">
                <h4>My First Blog Post</h4>
                <p>Welcome to my personal website! Here I will share my thoughts, coding journey, and projects.</p>
            </div>
        </div>
    </div>
</body>
</html/>
